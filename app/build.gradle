plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'androidx.navigation.safeargs'
    id 'com.google.protobuf'
    id 'kotlin-parcelize'
    id 'com.google.android.gms.oss-licenses-plugin'
    id 'com.google.devtools.ksp'
    // 自訂卡面的裁切編輯器（移植自 ZetaCard）使用 Jetpack Compose
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 加上 -cardart 後綴，與官方 1.9.3 區分（本版本新增 Payment Cards 的 Customize / Visibility）
def version = '1.9.3-cardart'
// 本 fork 在 GitHub Releases 的版本標籤：App 會拿它和 fork 最新 Release 的標籤比較來判斷有沒有更新。
// 每次發布新的 Release 前要先把這裡改成新的標籤（例如 v1.9.3-cardart-r4）再建置 APK。
def releaseTag = 'v1.9.3-cardart-r3'

android {
    // Compose BOM 2026.09.00 需要 compileSdk 37（原為 36）
    compileSdkVersion 37

    defaultConfig {
        applicationId "com.kieronquinn.app.classicpowermenu"
        minSdk 30
        targetSdk 35
        versionCode 193
        versionName version

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "TAG_NAME", "\"${releaseTag}\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        aidl true
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    namespace 'com.kieronquinn.app.classicpowermenu'
}

kotlin {
    // 本機沒有 JDK 11，改用目前的 JDK 編譯並輸出 Java 11 bytecode（原為 jvmToolchain(11)）
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11 }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.19.2"
    }
    plugins {
        javalite {
            artifact = 'com.google.protobuf:protoc-gen-javalite:3.0.1'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {
    api "androidx.security:security-crypto:1.1.0"

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'


    //Room for data storage
    api "androidx.room:room-runtime:$room_version"
    api "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    //AndroidX
    def lifecycle_version = "2.8.6"
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation "androidx.activity:activity-ktx:1.13.0"
    implementation "androidx.fragment:fragment-ktx:1.8.9"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-service:$lifecycle_version"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation "androidx.core:core-splashscreen:1.2.0"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    //Material
    implementation 'com.google.android.material:material:1.13.0'

    //Monet
    implementation 'com.github.KieronQuinn:MonetCompat:0.4.1'

    //Dependency injection
    implementation "io.insert-koin:koin-android:$koin_version"

    //Protobuf
    implementation "com.google.protobuf:protobuf-javalite:4.34.1"

    //Guava for hashing code (to match what Gpay uses)
    implementation 'com.google.guava:guava:33.5.0-android'

    //Stubs for hidden APIs. Shouldn't be included in APK.
    compileOnly project(':systemstubs')

    //packages/apps/QuickAccessWallet import
    implementation project(':QuickAccessWallet')

    //Device Controls code imported from SystemUI
    implementation project(':Controls')

    //Flexbox for buttons
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    //zxing for barcode/QR preview
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0@aar'

    //libsu for root operations
    def libsuVersion = '6.0.0'
    implementation "com.github.topjohnwu.libsu:core:${libsuVersion}"
    implementation "com.github.topjohnwu.libsu:service:${libsuVersion}"
    implementation "com.github.topjohnwu.libsu:io:${libsuVersion}"

    //Shizuku for helpful system service code (wallet/controls don't work with just Shizuku)
    def shizuku_version = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizuku_version"

    //Xposed
    compileOnly 'de.robv.android.xposed:api:82'

    //OSS libraries activity
    implementation 'com.google.android.gms:play-services-oss-licenses:17.5.0'

    //Retrofit for update checking
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    //Other third party
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'com.jakewharton:process-phoenix:3.0.0'
    implementation 'me.saket:better-link-movement-method:2.2.0'
    implementation "io.noties.markwon:core:4.6.2"

    //Compose（自訂卡面裁切編輯器，版本與 ZetaCardNext 相同）
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    //Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}